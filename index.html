<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run the Red Dot — Singapore Travel Guide</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(0,0,0,0.1);
      overflow: hidden;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    .topbar {
      background: #CC0001;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-icon {
      width: 36px;
      height: 36px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .topbar-icon i { color: #CC0001; font-size: 18px; }

    .topbar-text h1 { color: white; font-size: 16px; font-weight: 600; }
    .topbar-text p { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 1px; }

    .cat-scroll {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      background: white;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
      min-width: 64px;
    }

    .cat-btn i { font-size: 20px; color: #666; }
    .cat-btn span { font-size: 10px; color: #666; white-space: nowrap; }
    .cat-btn:hover { border-color: #CC0001; }
    .cat-btn:hover i, .cat-btn:hover span { color: #CC0001; }
    .cat-btn.active { background: #CC0001; border-color: #CC0001; }
    .cat-btn.active i, .cat-btn.active span { color: white; }

    .content { min-height: 200px; }

    .loading-state {
      padding: 40px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }

    .loading-state i {
      font-size: 28px;
      display: block;
      margin-bottom: 10px;
      animation: spin 1s linear infinite;
      color: #CC0001;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      padding: 48px 24px;
      text-align: center;
    }
    .empty-state i { font-size: 36px; color: #ccc; display: block; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; color: #888; }

    .section-header {
      padding: 12px 16px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .place-card {
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      transition: background 0.1s;
    }
    .place-card:last-child { border-bottom: none; }
    .place-card:hover { background: #fafafa; }

    .place-icon {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .place-icon i { font-size: 22px; }

    .place-info { flex: 1; min-width: 0; }
    .place-name { font-size: 14px; font-weight: 600; color: #111; }
    .place-area { font-size: 12px; color: #888; margin-top: 1px; }
    .place-desc { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.5; }

    .place-tags {
      display: flex;
      gap: 5px;
      margin-top: 7px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(0,0,0,0.1);
      color: #666;
    }

    .place-meta {
      text-align: right;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }
    .price { font-size: 12px; color: #888; }
    .stars { font-size: 11px; color: #CC0001; }
    .stars .rating-num { color: #888; }
    .open-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      background: #eafaf3;
      color: #1a7a4a;
      border: 1px solid #b3e8d0;
    }

    .error-state {
      padding: 32px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
    .error-state i { font-size: 28px; display: block; margin-bottom: 10px; color: #ccc; }

    footer {
      margin-top: 20px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }

    @media (max-width: 480px) {
      body { padding: 12px 0 32px; }
      .app { border-radius: 0; border-left: none; border-right: none; box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-icon"><i class="ti ti-map-pin"></i></div>
    <div class="topbar-text">
      <h1>Run the Red Dot</h1>
      <p>Singapore travel guide</p>
    </div>
  </div>

  <div class="cat-scroll">
    <button class="cat-btn" onclick="selectCat(this,'breakfast','Breakfast','ti-coffee','#EF9F27','#FFF8EC','Top breakfast and brunch spots in Singapore tourists should visit.')">
      <i class="ti ti-coffee"></i><span>Breakfast</span>
    </button>
    <button class="cat-btn" onclick="selectCat(this,'hawker','Hawker food','ti-bowl','#D85A30','#FFF0EB','Best hawker centres and famous food stalls in Singapore.')">
      <i class="ti ti-bowl"></i><span>Hawker</span>
    </button>
    <button class="cat-btn" onclick="selectCat(this,'landmarks','Landmarks','ti-building','#378ADD','#EAF3FF','Top landmarks and tourist attractions in Singapore.')">
      <i class="ti ti-building"></i><span>Landmarks</span>
    </button>
    <button class="cat-btn" onclick="selectCat(this,'nature','Nature','ti-tree','#3B6D11','#EAF3DE','Best parks, gardens and nature spots in Singapore.')">
      <i class="ti ti-tree"></i><span>Nature</span>
    </button>
    <button class="cat-btn" onclick="selectCat(this,'shopping','Shopping','ti-shopping-bag','#D4537E','#FDF0F5','Best shopping malls and markets in Singapore.')">
      <i class="ti ti-shopping-bag"></i><span>Shopping</span>
    </button>
    <button class="cat-btn" onclick="selectCat(this,'nightlife','Nightlife','ti-glass-full','#7F77DD','#F2F0FF','Best bars, clubs and nightlife in Singapore.')">
      <i class="ti ti-glass-full"></i><span>Nightlife</span>
    </button>
    <button class="cat-btn" onclick="selectCat(this,'museums','Museums','ti-building-arch','#1D9E75','#E1F5EE','Top museums and cultural spots in Singapore.')">
      <i class="ti ti-building-arch"></i><span>Museums</span>
    </button>
    <button class="cat-btn" onclick="selectCat(this,'hotels','Hotels','ti-bed','#CC0001','#FFF0F0','Best hotels in Singapore for tourists across all budgets.')">
      <i class="ti ti-bed"></i><span>Hotels</span>
    </button>
  </div>

  <div class="content" id="content">
    <div class="empty-state">
      <i class="ti ti-map-2"></i>
      <p>Pick a category above to explore Singapore</p>
    </div>
  </div>
</div>

<footer>Powered by Claude AI &nbsp;·&nbsp; Run the Red Dot</footer>

<script>
let activeCategory = null;

async function selectCat(btn, key, label, iconClass, color, bg, topic) {
  if (activeCategory === key) return;
  activeCategory = key;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const content = document.getElementById('content');
  content.innerHTML = `<div class="loading-state"><i class="ti ti-loader-2"></i>Finding the best ${label.toLowerCase()} spots…</div>`;

  const prompt = `You are a Singapore tourism expert. List 6 recommended places for: ${topic}
Return ONLY a valid JSON array (no markdown, no explanation) with this exact structure:
[{"name":"...","area":"...","description":"one short sentence","tags":["tag1","tag2"],"price":"$ or $$ or $$$ or Free","stars":4.5,"open":true}]`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: 'You are a Singapore tourism expert. Always respond with only a valid JSON array. No markdown fences, no extra text, no explanation.',
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await res.json();
    const raw = data.content?.[0]?.text || '[]';
    const places = JSON.parse(raw.replace(/```json|```/g, '').trim());
    renderPlaces(places, label, iconClass, color, bg);
  } catch(e) {
    content.innerHTML = `<div class="error-state"><i class="ti ti-alert-circle"></i><p>Couldn't load results. Please try again.</p></div>`;
  }
}

function renderPlaces(places, label, iconClass, color, bg) {
  const content = document.getElementById('content');
  if (!places || !places.length) {
    content.innerHTML = `<div class="empty-state"><i class="ti ti-map-2"></i><p>No results found.</p></div>`;
    return;
  }

  let html = `<div class="section-header">${label} in Singapore</div>`;

  places.forEach(p => {
    const starsNum = parseFloat(p.stars) || 0;
    const fullStars = Math.floor(starsNum);
    const half = (starsNum - fullStars) >= 0.5;
    let starStr = '★'.repeat(fullStars) + (half ? '½' : '');

    html += `<div class="place-card">
      <div class="place-icon" style="background:${bg};">
        <i class="ti ${iconClass}" style="color:${color};"></i>
      </div>
      <div class="place-info">
        <div class="place-name">${p.name}</div>
        <div class="place-area">${p.area}</div>
        <div class="place-desc">${p.description}</div>
        <div class="place-tags">${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="place-meta">
        <div class="price">${p.price || ''}</div>
        <div class="stars">${starStr} <span class="rating-num">${starsNum.toFixed(1)}</span></div>
        ${p.open ? '<span class="open-badge">Open</span>' : ''}
      </div>
    </div>`;
  });

  content.innerHTML = html;
}
</script>
</body>
</html>
