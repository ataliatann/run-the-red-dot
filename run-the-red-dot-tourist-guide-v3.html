<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Run the Red Dot — Singapore Travel Guide</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet"/>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet"/>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #CC0001;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .app {
      width: 100%;
      max-width: 540px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    }
    .topbar {
      background: #CC0001;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-icon {
      width: 36px; height: 36px;
      background: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .topbar-icon i { color: #CC0001; font-size: 18px; }
    .topbar-text h1 { color: white; font-size: 16px; font-weight: 600; }
    .topbar-text p { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 1px; }

    .cat-scroll {
      display: flex; gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      background: white;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.15s;
      min-width: 64px;
    }
    .cat-btn i { font-size: 20px; color: #666; }
    .cat-btn span { font-size: 10px; color: #666; white-space: nowrap; }
    .cat-btn:hover { border-color: #CC0001; }
    .cat-btn:hover i, .cat-btn:hover span { color: #CC0001; }
    .cat-btn.active { background: #CC0001; border-color: #CC0001; }
    .cat-btn.active i, .cat-btn.active span { color: white; }

    #map {
      width: 100%;
      height: 220px;
      border-bottom: 1px solid rgba(0,0,0,0.07);
    }

    .place-list { overflow-y: auto; max-height: 380px; }

    .section-header {
      padding: 10px 16px 6px;
      font-size: 11px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      position: sticky; top: 0; background: white; z-index: 1;
    }

    .place-card {
      display: flex; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      transition: background 0.1s;
      cursor: pointer;
    }
    .place-card:last-child { border-bottom: none; }
    .place-card:hover { background: #fafafa; }
    .place-card.highlighted { background: #fff5f5; }

    .place-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .place-icon i { font-size: 20px; }
    .place-info { flex: 1; min-width: 0; }
    .place-name { font-size: 14px; font-weight: 600; color: #111; }
    .place-area { font-size: 12px; color: #888; margin-top: 1px; }
    .place-desc { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.5; }
    .place-tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.1); color: #666; }
    .place-meta { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .price { font-size: 12px; color: #888; }
    .stars { font-size: 11px; color: #CC0001; }
    .rating-num { color: #888; font-size: 11px; }
    .open-badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: #eafaf3; color: #1a7a4a; border: 1px solid #b3e8d0; }

    footer { margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.6); text-align: center; }

    @media (max-width: 480px) {
      body { padding: 0 0 32px; background: #CC0001; }
      .app { border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
<div class="app">
<div class="topbar">
<div class="topbar-icon"><i class="ti ti-map-pin"></i></div>
<div class="topbar-text">
<h1>Run the Red Dot</h1>
<p>Curated guide for exploring Singapore</p>
</div>
</div>
<div class="cat-scroll">
<button class="cat-btn active" onclick="selectCat(this,'eat')"><i class="ti ti-tools-kitchen-2"></i><span>Eat</span></button>
<button class="cat-btn" onclick="selectCat(this,'photo')"><i class="ti ti-camera"></i><span>Photo Spots</span></button>
<button class="cat-btn" onclick="selectCat(this,'explore')"><i class="ti ti-map-pin-star"></i><span>Explore</span></button>
<button class="cat-btn" onclick="selectCat(this,'nature')"><i class="ti ti-tree"></i><span>Nature</span></button>
<button class="cat-btn" onclick="selectCat(this,'shopping')"><i class="ti ti-shopping-bag"></i><span>Shopping</span></button>

</div>
<div id="map"></div>
<div class="place-list" id="placeList"></div>
</div>
<footer>Run the Red Dot  ·  Singapore</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
