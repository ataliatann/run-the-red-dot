<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run the Red Dot — Singapore Travel Guide</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }
    .app {
      width: 100%;
      max-width: 540px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 20px rgba(0,0,0,0.1);
    }
    .topbar {
      background: #CC0001;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-icon {
      width: 36px; height: 36px;
      background: white; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .topbar-icon i { color: #CC0001; font-size: 18px; }
    .topbar-text h1 { color: white; font-size: 16px; font-weight: 600; }
    .topbar-text p { color: rgba(255,255,255,0.75); font-size: 12px; margin-top: 1px; }

    .cat-scroll {
      display: flex; gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      scrollbar-width: none;
    }
    .cat-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      background: white;
      cursor: pointer; flex-shrink: 0;
      transition: all 0.15s;
      min-width: 64px;
    }
    .cat-btn i { font-size: 20px; color: #666; }
    .cat-btn span { font-size: 10px; color: #666; white-space: nowrap; }
    .cat-btn:hover { border-color: #CC0001; }
    .cat-btn:hover i, .cat-btn:hover span { color: #CC0001; }
    .cat-btn.active { background: #CC0001; border-color: #CC0001; }
    .cat-btn.active i, .cat-btn.active span { color: white; }

    #map {
      width: 100%;
      height: 220px;
      border-bottom: 1px solid rgba(0,0,0,0.07);
      z-index: 0;
    }

    .place-list { overflow-y: auto; max-height: 400px; }

    .section-header {
      padding: 10px 16px 6px;
      font-size: 11px; font-weight: 600; color: #888;
      text-transform: uppercase; letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      position: sticky; top: 0; background: white; z-index: 1;
    }

    .place-card {
      display: flex; gap: 12px;
      padding: 13px 16px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      transition: background 0.1s;
      cursor: pointer;
    }
    .place-card:last-child { border-bottom: none; }
    .place-card:hover { background: #fafafa; }
    .place-card.highlighted { background: #fff5f5; }

    .place-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .place-icon i { font-size: 20px; }
    .place-info { flex: 1; min-width: 0; }
    .place-name { font-size: 14px; font-weight: 600; color: #111; }
    .place-area { font-size: 12px; color: #888; margin-top: 1px; }
    .place-desc { font-size: 12px; color: #555; margin-top: 4px; line-height: 1.5; }
    .place-tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.1); color: #666; }
    .place-meta { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .price { font-size: 12px; color: #888; }
    .stars { font-size: 11px; color: #CC0001; }
    .rating-num { color: #888; font-size: 11px; }
    .open-badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; background: #eafaf3; color: #1a7a4a; border: 1px solid #b3e8d0; }

    .empty-state { padding: 48px 24px; text-align: center; }
    .empty-state i { font-size: 36px; color: #ccc; display: block; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; color: #888; }

    footer { margin-top: 20px; font-size: 11px; color: #aaa; text-align: center; }

    @media (max-width: 480px) {
      body { padding: 0 0 32px; }
      .app { border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="topbar-icon"><i class="ti ti-map-pin"></i></div>
    <div class="topbar-text">
      <h1>Run the Red Dot</h1>
      <p>Singapore travel guide</p>
    </div>
  </div>

  <div class="cat-scroll">
    <button class="cat-btn active" onclick="selectCat(this,'breakfast')"><i class="ti ti-coffee"></i><span>Breakfast</span></button>
    <button class="cat-btn" onclick="selectCat(this,'hawker')"><i class="ti ti-bowl"></i><span>Hawker</span></button>
    <button class="cat-btn" onclick="selectCat(this,'landmarks')"><i class="ti ti-building"></i><span>Landmarks</span></button>
    <button class="cat-btn" onclick="selectCat(this,'nature')"><i class="ti ti-tree"></i><span>Nature</span></button>
    <button class="cat-btn" onclick="selectCat(this,'shopping')"><i class="ti ti-shopping-bag"></i><span>Shopping</span></button>
    <button class="cat-btn" onclick="selectCat(this,'nightlife')"><i class="ti ti-glass-full"></i><span>Nightlife</span></button>
    <button class="cat-btn" onclick="selectCat(this,'museums')"><i class="ti ti-building-arch"></i><span>Museums</span></button>
    <button class="cat-btn" onclick="selectCat(this,'hotels')"><i class="ti ti-bed"></i><span>Hotels</span></button>
  </div>

  <div id="map"></div>

  <div class="place-list" id="placeList">
    <div class="empty-state"><i class="ti ti-map-2"></i><p>Loading…</p></div>
  </div>
</div>

<footer>Run the Red Dot &nbsp;·&nbsp; Singapore</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

// ============================================================
//  YOUR RECOMMENDATIONS — edit anything in here!
//  Each place needs: name, area, description, tags, price,
//  stars (out of 5), open (true/false), lat, lng
// ============================================================
const PLACES = {

    { name: "Chin Mee Chin Confectionery", area: "Katong", description: "Old-school kopitiam with flaky toast and house-made kaya since 1925.", tags: ["Heritage", "Kaya toast", "Katong"], price: "$", stars: 4.4, open: true, lat: 1.3063, lng: 103.9034 },
    { name: "Symmetry", area: "Haji Lane", description: "Trendy all-day brunch spot with great eggs benny and flat whites.", tags: ["Brunch", "Coffee", "Instagram"], price: "$$", stars: 4.3, open: true, lat: 1.3014, lng: 103.8590 },
    { name: "Fong Sheng Hao", area: "Tanjong Pagar", description: "Taiwanese-style breakfast with thick milk toast and fresh soy milk.", tags: ["Taiwanese", "Healthy", "Queue"], price: "$", stars: 4.6, open: true, lat: 1.2768, lng: 103.8430 },
    { name: "Alter Ego", area: "Esplanade", description: "Waterfront café serving generous brunches with a view of Marina Bay.", tags: ["Waterfront", "Brunch", "Views"], price: "$$", stars: 4.2, open: true, lat: 1.2896, lng: 103.8554 },
    { name: "Toast Box", area: "Islandwide", description: "Reliable chain for traditional kaya toast sets — found in most malls.", tags: ["Chain", "Quick", "Local"], price: "$", stars: 4.1, open: true, lat: 1.3000, lng: 103.8559 }
  ],

  hawker: [
    { name: "Maxwell Food Centre", area: "Chinatown", description: "Famous for Tian Tian Hainanese chicken rice — Barack Obama ate here.", tags: ["Chicken rice", "Must-visit", "Iconic"], price: "$", stars: 4.6, open: true, lat: 1.2804, lng: 103.8448 },
    { name: "Lau Pa Sat", area: "CBD", description: "Victorian cast-iron market turned hawker hub, famous for satay at night.", tags: ["Satay", "Historic", "Night"], price: "$", stars: 4.4, open: true, lat: 1.2804, lng: 103.8505 },
    { name: "Old Airport Road Food Centre", area: "Kallang", description: "Massive local favourite with legendary char kway teow and rojak.", tags: ["Char kway teow", "Local", "Massive"], price: "$", stars: 4.5, open: true, lat: 1.3074, lng: 103.8826 },
    { name: "Tiong Bahru Market", area: "Tiong Bahru", description: "Hipster neighbourhood hawker with excellent chwee kueh and popiah.", tags: ["Chwee kueh", "Popiah", "Neighbourhood"], price: "$", stars: 4.5, open: true, lat: 1.2861, lng: 103.8271 },
    { name: "Chomp Chomp Food Centre", area: "Serangoon Gardens", description: "Beloved suburban hawker known for BBQ stingray and hokkien mee.", tags: ["BBQ", "Hokkien mee", "Night"], price: "$", stars: 4.4, open: false, lat: 1.3627, lng: 103.8701 },
    { name: "Newton Food Centre", area: "Newton", description: "Touristy but lively open-air hawker, great for crab and seafood.", tags: ["Seafood", "Crab", "Open-air"], price: "$$", stars: 4.2, open: true, lat: 1.3121, lng: 103.8380 }

    { name: "Merlion Park", area: "Marina Bay", description: "Singapore's national symbol — free photo stop by the waterfront.", tags: ["Free", "Photo stop", "Symbol"], price: "Free", stars: 4.3, open: true, lat: 1.2868, lng: 103.8545 },
    { name: "Chinatown", area: "Chinatown", description: "Colourful shophouses, Buddha Tooth Relic Temple and hawker food.", tags: ["Heritage", "Temple", "Shophouses"], price: "Free", stars: 4.5, open: true, lat: 1.2815, lng: 103.8444 },
    { name: "Kampong Glam", area: "Arab Street", description: "Sultan Mosque, Haji Lane and the best Middle Eastern food in SG.", tags: ["Mosque", "Haji Lane", "Culture"], price: "Free", stars: 4.6, open: true, lat: 1.3025, lng: 103.8597 },
    { name: "Sentosa Island", area: "Sentosa", description: "Beaches, Universal Studios, S.E.A. Aquarium and resort vibes.", tags: ["Beach", "Family", "Resort"], price: "$$", stars: 4.4, open: true, lat: 1.2494, lng: 103.8303 }
  ],

    { name: "Gardens by the Bay", area: "Marina Bay", description: "Stunning horticultural gardens with the world-famous Supertree Grove.", tags: ["Supertrees", "Free outside", "Night show"], price: "$", stars: 4.8, open: true, lat: 1.2816, lng: 103.8636 },

    { name: "Labrador Nature Reserve", area: "Labrador", description: "Quiet coastal park with WWII relics, mangroves and sea views.", tags: ["Hidden gem", "Coastal", "History"], price: "Free", stars: 4.4, open: true, lat: 1.2642, lng: 103.8021 },
    { name: "Pulau Ubin", area: "Changi", description: "Step back in time on this rustic island — rent a bike and explore.", tags: ["Island", "Cycling", "Old Singapore"], price: "$", stars: 4.7, open: true, lat: 1.4043, lng: 103.9619 },
    { name: "Southern Ridges", area: "HarbourFront", description: "10km of connected parks with forest walks and sea views — totally free.", tags: ["Hiking", "Sea views", "Free"], price: "Free", stars: 4.6, open: true, lat: 1.2726, lng: 103.8127 }
  ],

  shopping: [
    { name: "Orchard Road", area: "Orchard", description: "Singapore's main shopping belt — ION, Paragon, 313 and more.", tags: ["Malls", "Fashion", "Iconic"], price: "$$", stars: 4.5, open: true, lat: 1.3040, lng: 103.8318 },
    { name: "Haji Lane", area: "Arab Street", description: "Narrow street of indie boutiques, vintage finds and quirky cafés.", tags: ["Indie", "Vintage", "Instagram"], price: "$$", stars: 4.6, open: true, lat: 1.3014, lng: 103.8590 },
    { name: "Bugis Street Market", area: "Bugis", description: "Bargain street market for clothes, accessories and souvenirs.", tags: ["Bargain", "Souvenirs", "Street market"], price: "$", stars: 4.2, open: true, lat: 1.2999, lng: 103.8561 },
    { name: "Mustafa Centre", area: "Little India", description: "24-hour department store selling everything imaginable at great prices.", tags: ["24 hours", "Bargain", "Everything"], price: "$", stars: 4.3, open: true, lat: 1.3067, lng: 103.8562 },
    { name: "VivoCity", area: "HarbourFront", description: "Singapore's largest mall with a rooftop pool view and Sentosa access.", tags: ["Largest mall", "Rooftop", "Sentosa"], price: "$$", stars: 4.4, open: true, lat: 1.2644, lng: 103.8222 },
    { name: "Tiong Bahru", area: "Tiong Bahru", description: "Singapore's coolest neighbourhood for indie bookshops and local designers.", tags: ["Indie", "Books", "Hipster"], price: "$$", stars: 4.7, open: true, lat: 1.2866, lng: 103.8271 }
  ],

  nightlife: [
    { name: "1-Altitude", area: "Raffles Place", description: "Rooftop bar on the 63rd floor — highest alfresco bar in the world.", tags: ["Rooftop", "Views", "Sky bar"], price: "$$$", stars: 4.4, open: true, lat: 1.2840, lng: 103.8516 },
    { name: "Zouk", area: "Clarke Quay", description: "Singapore's most iconic club — world-class DJs and legendary dance floors.", tags: ["Club", "EDM", "Legendary"], price: "$$$", stars: 4.5, open: false, lat: 1.2893, lng: 103.8467 },
    { name: "Atlas Bar", area: "Bugis", description: "Art Deco gin palace with over 1,300 gins — stunning grand lobby.", tags: ["Gin", "Art Deco", "Cocktails"], price: "$$$", stars: 4.7, open: true, lat: 1.2999, lng: 103.8557 },
    { name: "Lantern at Fullerton Bay", area: "Marina Bay", description: "Rooftop bar with front-row views of Marina Bay and the skyline.", tags: ["Rooftop", "Skyline", "Romantic"], price: "$$$", stars: 4.5, open: true, lat: 1.2863, lng: 103.8536 },
    { name: "Tanjong Beach Club", area: "Sentosa", description: "Beach club with pools, DJ sets and cocktails — best weekend vibes.", tags: ["Beach club", "Pool", "Weekend"], price: "$$", stars: 4.4, open: false, lat: 1.2477, lng: 103.8220 },
    { name: "Potato Head", area: "Keong Saik", description: "Three floors of eclectic bars and a rooftop garden in a heritage building.", tags: ["Heritage", "Craft cocktails", "Rooftop"], price: "$$", stars: 4.4, open: true, lat: 1.2793, lng: 103.8423 }
  ],

  museums: [
    { name: "National Museum of Singapore", area: "Bras Basah", description: "Singapore's oldest museum — immersive exhibitions on local history and culture.", tags: ["History", "Free Fri eve", "Immersive"], price: "$", stars: 4.6, open: true, lat: 1.2966, lng: 103.8487 },
    { name: "ArtScience Museum", area: "Marina Bay", description: "The iconic lotus-shaped museum with cutting-edge digital art exhibitions.", tags: ["Digital art", "Iconic", "MBS"], price: "$$", stars: 4.6, open: true, lat: 1.2863, lng: 103.8596 },
    { name: "Asian Civilisations Museum", area: "Empress Place", description: "Explores Asia's rich heritage — beautiful riverfront building too.", tags: ["Asian culture", "Heritage", "Waterfront"], price: "$", stars: 4.5, open: true, lat: 1.2877, lng: 103.8513 },
    { name: "Peranakan Museum", area: "Armenian Street", description: "Beautifully curated museum on Straits Chinese Peranakan culture.", tags: ["Peranakan", "Culture", "Nyonya"], price: "$", stars: 4.6, open: true, lat: 1.2952, lng: 103.8486 },
    { name: "National Gallery Singapore", area: "City Hall", description: "World's largest public collection of Southeast Asian art in two historic buildings.", tags: ["Art", "Colonial", "SE Asia"], price: "$$", stars: 4.6, open: true, lat: 1.2903, lng: 103.8514 },
    { name: "S.E.A. Aquarium", area: "Sentosa", description: "One of the world's largest aquariums with 100,000 marine animals.", tags: ["Family", "Marine life", "Sentosa"], price: "$$", stars: 4.5, open: true, lat: 1.2541, lng: 103.8230 }
  ],

  hotels: [
    { name: "Marina Bay Sands", area: "Marina Bay", description: "The most iconic hotel in Singapore — infinity pool, casino and sky park.", tags: ["Iconic", "Infinity pool", "Luxury"], price: "$$$", stars: 4.7, open: true, lat: 1.2840, lng: 103.8607 },
    { name: "Raffles Hotel", area: "City Hall", description: "Singapore's most historic hotel — birthplace of the Singapore Sling.", tags: ["Heritage", "Colonial", "Legendary"], price: "$$$", stars: 4.8, open: true, lat: 1.2948, lng: 103.8526 },
    { name: "Capella Singapore", area: "Sentosa", description: "Ultra-luxurious colonial resort nestled in Sentosa's rainforest.", tags: ["Luxury", "Resort", "Sentosa"], price: "$$$", stars: 4.9, open: true, lat: 1.2483, lng: 103.8271 },
    { name: "Naumi Hotel", area: "City Hall", description: "Boutique design hotel with a rooftop infinity pool — great value luxury.", tags: ["Boutique", "Rooftop pool", "Design"], price: "$$", stars: 4.5, open: true, lat: 1.2943, lng: 103.8530 },
    { name: "Wanderlust Hotel", area: "Little India", description: "Quirky design hotel in a heritage schoolhouse — each floor has a theme.", tags: ["Boutique", "Design", "Heritage"], price: "$$", stars: 4.3, open: true, lat: 1.3076, lng: 103.8519 },
    { name: "Hotel G Singapore", area: "Bugis", description: "Affordable, stylish hotel in the heart of Bugis — great for young travellers.", tags: ["Budget-friendly", "Central", "Stylish"], price: "$", stars: 4.2, open: true, lat: 1.3003, lng: 103.8556 }
  ]

};

// ============================================================
//  Category config — colours & icons
// ============================================================
const CATS = {
  breakfast:  { label: "Breakfast",  icon: "ti-coffee",        color: "#EF9F27", bg: "#FFF8EC" },
  hawker:     { label: "Hawker food", icon: "ti-bowl",          color: "#D85A30", bg: "#FFF0EB" },
  landmarks:  { label: "Landmarks",  icon: "ti-building",      color: "#378ADD", bg: "#EAF3FF" },
  nature:     { label: "Nature",     icon: "ti-tree",           color: "#3B6D11", bg: "#EAF3DE" },
  shopping:   { label: "Shopping",   icon: "ti-shopping-bag",   color: "#D4537E", bg: "#FDF0F5" },
  nightlife:  { label: "Nightlife",  icon: "ti-glass-full",     color: "#7F77DD", bg: "#F2F0FF" },
  museums:    { label: "Museums",    icon: "ti-building-arch",  color: "#1D9E75", bg: "#E1F5EE" },
  hotels:     { label: "Hotels",     icon: "ti-bed",            color: "#CC0001", bg: "#FFF0F0" }
};

// ============================================================
//  Map setup
// ============================================================
const map = L.map('map', { zoomControl: true, attributionControl: false })
  .setView([1.2900, 103.8500], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let markers = [];

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

function addMarkers(places, catKey) {
  clearMarkers();
  const cat = CATS[catKey];
  const bounds = [];
  places.forEach((p, i) => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${cat.color};color:white;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.3);">${i+1}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14]
    });
    const m = L.marker([p.lat, p.lng], { icon })
      .addTo(map)
      .bindPopup(`<strong>${p.name}</strong><br><span style="font-size:12px;color:#666;">${p.area}</span>`);
    m.on('click', () => highlightCard(i));
    markers.push(m);
    bounds.push([p.lat, p.lng]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [30, 30] });
}

function highlightCard(index) {
  document.querySelectorAll('.place-card').forEach((c, i) => {
    c.classList.toggle('highlighted', i === index);
    if (i === index) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
}

// ============================================================
//  Render
// ============================================================
let activeKey = 'breakfast';

function selectCat(btn, key) {
  if (activeKey === key) return;
  activeKey = key;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPlaces(key);
}

function renderPlaces(key) {
  const places = PLACES[key];
  const cat = CATS[key];
  addMarkers(places, key);

  let html = `<div class="section-header">${cat.label} in Singapore</div>`;
  places.forEach((p, i) => {
    const starsNum = parseFloat(p.stars) || 0;
    const full = Math.floor(starsNum);
    const half = (starsNum - full) >= 0.5;
    const starStr = '★'.repeat(full) + (half ? '½' : '');
    html += `<div class="place-card" onclick="focusMarker(${i})">
      <div class="place-icon" style="background:${cat.bg};">
        <i class="ti ${cat.icon}" style="color:${cat.color};"></i>
      </div>
      <div class="place-info">
        <div class="place-name"><span style="color:${cat.color};font-size:11px;font-weight:700;margin-right:5px;">${i+1}</span>${p.name}</div>
        <div class="place-area">${p.area}</div>
        <div class="place-desc">${p.description}</div>
        <div class="place-tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <div class="place-meta">
        <div class="price">${p.price}</div>
        <div class="stars">${starStr} <span class="rating-num">${starsNum.toFixed(1)}</span></div>
        ${p.open ? '<span class="open-badge">Open</span>' : ''}
      </div>
    </div>`;
  });

  document.getElementById('placeList').innerHTML = html;
}

function focusMarker(i) {
  const m = markers[i];
  if (m) { map.setView(m.getLatLng(), 15); m.openPopup(); }
  highlightCard(i);
}
